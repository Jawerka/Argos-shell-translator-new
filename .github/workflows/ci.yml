name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest charset-normalizer httpx ruff

      - name: Verify EXE spec
        run: python scripts/verify_spec.py

      - name: Run tests
        run: pytest tests/ -q -m "not integration" --cov=argos_translator.engines --cov=argos_translator.services --cov=argos_translator.config --cov-fail-under=80

      - name: Ruff (syntax / critical)
        run: ruff check src tests
