name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest charset-normalizer httpx ruff

      - name: Verify EXE spec
        run: python scripts/verify_spec.py

      - name: Run tests
        run: pytest tests/ -q -m "not integration" --cov=argos_translator.engines --cov=argos_translator.services --cov=argos_translator.config --cov-fail-under=80

      - name: Ruff (syntax / critical)
        run: ruff check src tests

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Workspace pub get
        run: flutter pub get

      - name: Analyze translator_core
        run: dart analyze --fatal-infos packages/translator_core

      - name: Test translator_core
        working-directory: packages/translator_core
        run: dart test

      - name: Analyze Flutter app
        working-directory: apps/translator
        run: flutter analyze --fatal-infos

      - name: Flutter tests
        working-directory: apps/translator
        run: flutter test
