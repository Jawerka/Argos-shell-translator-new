name: translator
description: Argos Translate — Flutter Windows shell.
publish_to: none
version: 2.1.0+1
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  desktop_drop: ^0.7.1
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  intl: ^0.20.2
  path: ^1.9.0
  tray_manager: ^0.2.3
  translator_core:
    path: ../../packages/translator_core
  window_manager: ^0.4.3
  hotkey_manager: ^0.2.3
  win32: ^5.15.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/argos_translate.ico
    - assets/icons/argos_translate.png
