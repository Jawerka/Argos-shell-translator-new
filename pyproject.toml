[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-translator"
version = "2.1.0"
description = "Argos engines and HTTP sidecar for the Flutter Argos Translate app"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "argostranslate>=1.10.0",
    "lingua-language-detector>=2.0.0",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pyinstaller>=5.0.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "sidecar", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: tests requiring installed Argos models or LLM server",
]

[tool.coverage.run]
source = ["argos_translator", "sidecar"]
omit = [
    "*/services/frozen_bootstrap.py",
    "*/services/model_manager.py",
]

[tool.coverage.report]
fail_under = 80
