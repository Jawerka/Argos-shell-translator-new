[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-translator"
version = "2.0.0"
description = "Argos Translate Streaming — desktop translator with Argos and LLM"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "argostranslate>=1.10.0",
    "pyperclip>=1.8.0",
    "keyboard>=0.13.5",
    "langdetect>=1.0.9",
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
    "charset-normalizer>=3.0",
    "httpx>=0.27.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "sidecar", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[project.scripts]
argos-translator = "argos_translator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: tests requiring installed Argos models or LLM server",
]

[tool.coverage.run]
source = ["argos_translator"]
omit = [
    "*/services/tray.py",
    "*/services/clipboard.py",
    "*/services/hotkeys.py",
    "*/services/frozen_bootstrap.py",
    "*/services/model_manager.py",
    "*/engines/base.py",
    "*/engines/factory.py",
]

[tool.coverage.report]
fail_under = 80
